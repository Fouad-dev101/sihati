<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ⬇️ C'est CE lien qui remplace le "+" par ton logo dans l'onglet -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <title>DalilSehati — Trouvez un professionnel de santé au Maroc</title>
    <meta name="description" content="Annuaire des médecins et infirmiers au Maroc. Recherchez par spécialité, ville ou clinique et appelez directement." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DalilSehati — Annuaire médical marocain" />
    <meta property="og:description" content="Trouvez un médecin ou un infirmier près de chez vous." />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:locale" content="fr_MA" />
    <meta property="og:locale:alternate" content="ar_MA" />
    <script>
      (function () {
        try {
          var l = localStorage.getItem('lang');
          if (l === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
